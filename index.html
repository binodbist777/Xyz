<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How Are You?</title><style>
body {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  background: linear-gradient(to bottom right, #fdf0f5, #dbe6ff);
  font-family: Arial, sans-serif;
  overflow: hidden;
}

h2 {
  font-size: 3em;
  color: palevioletred;
  text-align: center;
  margin-bottom: 30px;
  text-shadow: 2px 2px 5px rgba(0,0,0,0.2);
  z-index: 2;
}

button {
  font-size: 1.5em;
  padding: 15px 30px;
  color: white;
  background-color: blueviolet;
  border: none;
  border-radius: 15px;
  cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s;
  z-index: 2;
}

button:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px rgba(138,43,226,0.8);
}

.heart {
  position: absolute;
  top: -20px;
  color: #1e90ff;
  font-size: 20px;
  animation: fall linear infinite;
  z-index: 1;
  opacity: 0.8;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
  }
}

.reveal-overlay {
  display: flex;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  justify-content: center;
  align-items: center;
  z-index: 20;
}

.reveal-box {
  width: 90%;
  max-width: 600px;
  background: white;
  border-radius: 20px;
  padding: 25px;
  text-align: center;
  box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

.reveal-box h3 {
  color: palevioletred;
  font-size: 2em;
  margin-bottom: 20px;
}

#revealVideo {
  display: none;
  width: 100%;
  max-height: 70vh;
  border-radius: 15px;
  margin-top: 10px;
}
</style></head><body><div class="reveal-overlay" id="revealOverlay">
  <div class="reveal-box"><h3>💙 A Little Surprise 💙</h3>

<button id="revealButton">
  CLICK TO REVEAL
</button>

<video id="revealVideo" controls playsinline>
  <source src="Reveal.mp4" type="video/mp4">
  Your browser does not support the video.
</video>

  </div>
</div><script>
const revealButton = document.getElementById("revealButton");
const revealVideo = document.getElementById("revealVideo");

function createHeart() {
  const heart = document.createElement("div");

  heart.classList.add("heart");
  heart.innerHTML = "💙";

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 20 + 10) + "px";
  heart.style.animationDuration = (Math.random() * 5 + 5) + "s";

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 10000);
}

setInterval(createHeart, 300);

revealButton.addEventListener("click", () => {
  revealButton.style.display = "none";
  revealVideo.style.display = "block";

  revealVideo.play().catch(() => {
    console.log("Press play to start the video.");
  });
});
</script></body>
</html>
